name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Disable the lefthook git hooks in CI: the changesets action makes a
    # "Version Packages" commit, which must not be gated by commitlint / pre-commit.
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      # Diagnostic only — never fails the job. Two publishing paths are valid:
      #   * trusted publishing (OIDC): there is no token, so `whoami` legitimately
      #     reports E401 and the publish still succeeds;
      #   * NPM_TOKEN: `whoami` must print the account. E401 there means the token is
      #     expired/invalid, and E403 at publish time means it does not bypass 2FA
      #     (a classic *Publish* token does not; an *Automation* one does).
      - name: Verify npm auth (diagnostic)
        run: npm whoami || echo "no npm token — expected when publishing via OIDC"
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Opens/updates a "Version Packages" PR; on merge of that PR, publishes
      # (`pnpm release` -> scripts/release.mjs, which also tags v<version>).
      # Requires repo Settings -> Actions -> General -> Workflow permissions ->
      #   "Allow GitHub Actions to create and approve pull requests" (enabled).
      #
      # Publishing credentials, in order of preference:
      #   1. Trusted publishing (OIDC) — nothing to store. `id-token: write` above is
      #      the repo side; the other half is registering this workflow FILE NAME
      #      (release.yml) as a Trusted Publisher at
      #      https://www.npmjs.com/package/effector-refetch/access
      #      (on the PACKAGE, not under account settings — npm/cli#8910).
      #      pnpm attempts it first and logs `Skipped OIDC: ... (status code 404)`
      #      while that registration is missing.
      #   2. NPM_TOKEN — the fallback below. Delete it once OIDC publishes a release.
      # See docs/guide/contributing.md -> "Required repository setup".
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # setup-node's registry-url writes .npmrc referencing ${NODE_AUTH_TOKEN};
          # without it the token is substituted empty and npm replies E404 on publish.
          # NPM_TOKEN is also kept for changesets/action's own auth handling.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

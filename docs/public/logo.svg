<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="effector-refetch">
  <defs>
    <linearGradient id="er" x1="128" y1="24" x2="128" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fd7e14"/>
      <stop offset="1" stop-color="#e8590c"/>
    </linearGradient>
  </defs>
  <!-- refetch cycle: a clockwise ring, open at the top, around the effect node -->
  <circle cx="128" cy="128" r="72" stroke="url(#er)" stroke-width="27" stroke-linecap="round"
          stroke-dasharray="377 75.4" transform="rotate(-60 128 128)"/>
  <!-- arrow head at the left end of the gap, aligned to the clockwise tangent -->
  <path d="M116.25 51.65 L97.9 81.87 L80.9 52.43 Z" fill="url(#er)"/>
  <!-- effect node -->
  <circle cx="128" cy="128" r="26" fill="url(#er)"/>
</svg>
